<style>
:root{
  --ink:#0d1424; --ink-2:#131d33; --parchment:#f7f0dd; --parchment-2:#ece1c4;
  --gold:#c9a227; --gold-soft:#e0c159; --text:#f2ecdc; --text-dim:#b9c2d6;
  --hit:#2f7d43; --close:#c9922a; --miss:#9c2b2b;
  --radius:14px; --edge:rgba(201,162,39,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;

    var(--ink);
  background-attachment:fixed;
  -webkit-text-size-adjust:100%;
}
.app{max-width:1080px;margin:0 auto;padding:24px 16px 72px}
.masthead{text-align:center}
h1.wordmark{

}
.wordmark .a{font-weight:700}
.wordmark .b{font-weight:400;color:var(--gold-soft)}
.tagline{margin:6px 0 0;color:var(--text-dim)}
.toolbar{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.tool{

  cursor:pointer;transition:background .15s,transform .15s;
}
.tool:hover{background:rgba(201,162,39,.16);transform:translateY(-1px)}
.tool[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.tool svg{width:22px;height:22px}
.tool.house{width:auto;padding:0 14px;border-radius:22px;font-size:.78rem;font-weight:700;letter-spacing:.04em;font-family:inherit}
.modes{display:flex;justify-content:center;gap:clamp(8px,3vw,22px);margin:22px 0 18px;flex-wrap:wrap}
.mode{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text);cursor:pointer;font-family:inherit}
.disc{

}
.mode:hover .disc{transform:translateY(-2px)}
.mode[aria-current=true] .disc{background:var(--parchment-2);border-color:var(--gold)}
.disc svg{width:56%;height:56%}
.mode-label{font-size:.92rem}
.done{
  position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;
  background:var(--hit);color:#fff;display:grid;place-items:center;font-size:.75rem;font-weight:700;
  border:2px solid var(--ink);
}

.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-head h2{margin:0;font-size:1.22rem}
.prompt{margin:6px 0 0;text-align:center;font-size:1.05rem}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--text-dim)}
.streak.lit{color:var(--gold-soft)}
.streak svg{width:24px;height:24px}

.kind{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:9px 18px;font:inherit;font-size:.95rem;background:transparent;color:var(--text-dim);cursor:pointer}
.kind svg{width:18px;height:18px}
.kind[aria-pressed=true]{background:var(--gold);color:var(--ink);font-weight:700}
.hints{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.hint{
  flex:1 1 160px;min-height:92px;border:1px solid var(--edge);border-radius:10px;padding:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  text-align:center;background:rgba(255,255,255,.03);color:var(--text-dim);font-size:.86rem;

.hint .glyph{font-size:1.5rem;line-height:1}
.hint.on{border-color:var(--gold);color:var(--text);background:rgba(201,162,39,.1)}

.hint .val{font-weight:700}
.clue{margin-top:16px;background:var(--parchment);color:#221c10;border:3px double var(--gold);border-radius:var(--radius);padding:18px}
.clue .kicker{margin:0 0 8px;text-align:center;color:#5a4a29;font-size:.95rem}
.clue .body{margin:0;text-align:justify;hyphens:auto;font-size:clamp(1rem,2.6vw,1.15rem);line-height:1.55}
.guessbar{margin-top:16px;position:relative}
.guessbar input{
  width:100%;padding:16px 52px 16px 18px;font:inherit;font-size:1.05rem;color:#221c10;
  background:var(--parchment);border:1px solid var(--gold);border-radius:10px;
}
.guessbar input::placeholder{color:#8a7a5c}
.guessbar input:disabled{opacity:.55}
.submit{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:8px;background:transparent;color:#6b5a34;cursor:pointer;font-size:1.2rem}
.suggestions{
  position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);margin:0;padding:4px;list-style:none;
  max-height:280px;overflow-y:auto;background:var(--parchment);color:#221c10;
  border:1px solid var(--gold);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.45);
}
.suggestions button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-radius:7px;background:transparent;color:inherit;font:inherit;font-size:1rem;cursor:pointer}
.suggestions button:hover,.suggestions li.active button{background:var(--parchment-2)}
.alias{color:#6b5a34;font-size:.86rem}
.notice{margin:10px 0 0;text-align:center;color:var(--gold-soft);font-size:.92rem;min-height:1.2em}
.table-wrap{margin-top:20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.guesses{border-collapse:separate;border-spacing:6px;width:100%;min-width:640px}
table.guesses th{font-weight:400;font-size:.95rem;padding:6px 4px 10px;border-bottom:2px solid var(--gold);white-space:nowrap}
table.guesses td{padding:0}
.cell{
  border-radius:8px;min-height:74px;padding:8px 6px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;text-align:center;font-size:.86rem;line-height:1.25;
  animation:flip .4s ease both;
}
.cell.hit{background:var(--hit)}
.cell.close{background:var(--close);color:#241c06}
.cell.miss{background:var(--miss)}
.cell.name{background:rgba(255,255,255,.07);font-size:.95rem;font-weight:700}
.arrow{font-size:1.35rem;line-height:1}

@media(prefers-reduced-motion:reduce){.cell{animation:none}}
.legend{display:flex;gap:14px;justify-content:center;margin-top:12px;flex-wrap:wrap;color:var(--text-dim);font-size:.85rem}

.swatch{width:14px;height:14px;border-radius:4px;display:inline-block}

.answer{font-size:clamp(1.4rem,5vw,2rem);text-decoration:underline;text-underline-offset:6px;margin:0}
.end .label{color:var(--text-dim);margin:14px 0 2px}
.countdown{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.25rem;margin:0}
.portrait{

.btn{font:inherit;font-size:1rem;padding:12px 22px;border-radius:999px;cursor:pointer;border:1px solid var(--gold);background:var(--gold);color:var(--ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--gold-soft);font-weight:400}
.actions{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.next-mode{margin-top:16px}
.next-mode .disc{width:58px;margin:0 auto}
.yesterday{margin-top:18px;text-align:center;color:var(--text-dim);font-size:.95rem}
.yesterday b{color:var(--gold-soft);font-style:italic}
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(4,8,16,.72);display:grid;place-items:center;padding:18px}
.modal{width:min(520px,100%);max-height:86vh;overflow-y:auto;background:var(--ink-2);border:1px solid var(--gold);border-radius:var(--radius);padding:20px}
.modal h2{margin-top:0;color:var(--gold-soft)}
.modal p,.modal li,.modal td{color:var(--text-dim);line-height:1.55}
.modal-close{float:right;border:0;background:transparent;color:var(--text-dim);font-size:1.5rem;cursor:pointer;line-height:1}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0 18px}
.statbox{background:rgba(255,255,255,.04);border:1px solid var(--edge);border-radius:10px;padding:12px;text-align:center}
.statbox b{display:block;font-size:1.6rem;color:var(--gold-soft)}
.statbox span{font-size:.8rem;color:var(--text-dim)}
.houses{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.house-btn{font:inherit;padding:14px;border-radius:10px;cursor:pointer;border:2px solid var(--edge);background:rgba(255,255,255,.04);color:var(--text)}

.hidden{display:none !important}
@media(max-width:560px){
  table.guesses{min-width:560px;border-spacing:4px}
  .cell{min-height:62px;font-size:.76rem}
  .panel{padding:13px}
}
</style>
</head>

const bookTitle = n => BOOK_TITLES[n - 1] || ("Book " + n);

/* ============================================================
   Deterministic randomness
   ============================================================ */
function hashString(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}
const pickBySeed = (items, seed) => items[hashString(seed) % items.length];
function pickRandom(items, exclude) {
  const pool = exclude ? items.filter(i => !exclude(i)) : items;
  const src = pool.length ? pool : items;
  return src[Math.floor(Math.random() * src.length)];
}

/* ============================================================
   UTC day handling
   ============================================================ */
const DAY_MS = 86400000;
function puzzleDay(now) {
  const d = new Date((now || new Date()).getTime() - BRAND.rolloverHourUTC * 3600000);
  return d.toISOString().slice(0, 10);
}
const previousDay = day => new Date(Date.parse(day + "T00:00:00Z") - DAY_MS).toISOString().slice(0, 10);
function msUntilRollover() {
  const d = new Date(Date.now() - BRAND.rolloverHourUTC * 3600000);
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + 1) - d.getTime();
}
function formatCountdown(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  const p = n => String(n).padStart(2, "0");
  return p(Math.floor(t / 3600)) + ":" + p(Math.floor(t % 3600 / 60)) + ":" + p(t % 60);
}

/* ============================================================
   Guess comparison
   ============================================================ */
const exact = (label, g, a) => ({ label, value: g, state: g === a ? "hit" : "miss" });

// Multi-value columns: green only on an identical set, amber on any overlap.
function overlap(label, g, a) {
  const gs = new Set(g), as = new Set(a);
  const shared = [...gs].filter(v => as.has(v));
  const state = (shared.length === gs.size && gs.size === as.size) ? "hit"
              : shared.length ? "close" : "miss";
  return { label, value: g.length ? g.join(" • ") : "None", state };
}

// Numeric columns: green on equal, amber within threshold, plus a direction arrow.
function numeric(label, g, a, within, render) {
  render = render || String;
  if (g === null || a === null) {
    return { label, value: g === null ? "Unknown" : render(g), state: g === a ? "hit" : "miss" };
  }
  if (g === a) return { label, value: render(g), state: "hit" };
  return {
    label,
    value: render(g),
    state: Math.abs(g - a) <= within ? "close" : "miss",
    direction: a > g ? "up" : "down"
  };
}

const CHARACTER_COLUMNS = ["Character","Gender","Blood","Born","House","Species","Patronus","Affiliations","First Appearance"];
const SPELL_COLUMNS     = ["Spell","Type","Light","First Appearance"];
const PLACE_COLUMNS     = ["Location","Kind","Region","First Appearance"];

function compareCharacter(g, a) {
  return {
    id: g.id, name: g.name, image: g.image, correct: g.id === a.id,
    cells: [
      exact("Gender", g.gender, a.gender),
      exact("Blood", g.blood, a.blood),
      numeric("Born", g.born, a.born, CLOSE.bornYear),
      exact("House", g.house, a.house),
      exact("Species", g.species, a.species),
      exact("Patronus", g.patronus, a.patronus),
      overlap("Affiliations", g.affiliations, a.affiliations),
      numeric("First Appearance", g.firstBook, a.firstBook, CLOSE.firstBook, bookTitle)
    ]
  };
}
function compareSpell(g, a) {
  return {
    id: g.id, name: g.name, correct: g.id === a.id,
    cells: [
      exact("Type", g.type, a.type),
      exact("Light", g.light, a.light),
      numeric("First Appearance", g.firstBook, a.firstBook, CLOSE.firstBook, bookTitle)
    ]
  };
}
function comparePlace(g, a) {
  return {
    id: g.id, name: g.name, correct: g.id === a.id,
    cells: [
      exact("Kind", g.kind, a.kind),
      exact("Region", g.region, a.region),
      numeric("First Appearance", g.firstBook, a.firstBook, CLOSE.firstBook, bookTitle)
    ]
  };
}

   ============================================================ */
const dailyAnswer = (mode, day) => pickBySeed(MODES[mode].answerIds, BRAND.storageKey + "|" + mode + "|" + day);

// Unlimited avoids anything still inside the recent-history window.
function unlimitedAnswer(mode, seen) {
  const ids = MODES[mode].answerIds;
  const recent = new Set(seen.slice(0, Math.floor(ids.length * 0.6)));
  return pickRandom(ids, id => recent.has(id));
}

const blankSession = answerId => ({ answerId, guesses: [], status: "playing" });
const emptyStats = () => ({ played:0, won:0, currentStreak:0, maxStreak:0, guessesInWins:0, lastWinDay:null });
const byMode = make => {
  const o = {};
  MODE_ORDER.forEach(m => { o[m] = make(m); });
  return o;
};

function freshState() {
  const day = puzzleDay();
  return {
    mode: "classic", kind: "daily", house: null, spoilerFree: false, day,
    daily: byMode(m => blankSession(dailyAnswer(m, day))),
    unlimited: byMode(m => blankSession(unlimitedAnswer(m, []))),
    seen: byMode(() => []),
    stats: { daily: byMode(emptyStats), unlimited: byMode(emptyStats) }
  };
}

let S;
function load() {
  try {
    const raw = localStorage.getItem(BRAND.storageKey);
    if (!raw) return freshState();
    const parsed = JSON.parse(raw);
    // Merge over a fresh state so a data update never leaves a mode undefined.
    const base = freshState();
    return Object.assign(base, parsed, {
      daily:     Object.assign(base.daily, parsed.daily),
      unlimited: Object.assign(base.unlimited, parsed.unlimited),
      seen:      Object.assign(base.seen, parsed.seen),
      stats: {
        daily:     Object.assign(base.stats.daily, (parsed.stats || {}).daily),
        unlimited: Object.assign(base.stats.unlimited, (parsed.stats || {}).unlimited)
      }
    });
  } catch (e) {
    return freshState();
  }
}
function save() {
  try { localStorage.setItem(BRAND.storageKey, JSON.stringify(S)); } catch (e) { /* private mode */ }
}

// Re-seed the daily puzzles when the UTC day turns over.
function syncDay() {
  const today = puzzleDay();
  if (S.day === today) return false;
  MODE_ORDER.forEach(m => {
    const st = S.stats.daily[m];
    if (S.daily[m].status === "playing" && S.daily[m].guesses.length) {
      st.played++; st.currentStreak = 0;              // abandoned mid-game
    } else if (S.daily[m].status !== "won" && st.lastWinDay !== S.day) {
      st.currentStreak = 0;                            // never started
    }
  });
  S.day = today;
  S.daily = byMode(m => blankSession(dailyAnswer(m, today)));
  save();
  return true;
}

const session = () => S[S.kind][S.mode];
const stats   = () => S.stats[S.kind][S.mode];

function submitGuess(id) {
  const def = MODES[S.mode], sess = session();
  if (sess.status !== "playing") return false;
  if (!def.search.some(s => s.id === id)) return false;
  if (sess.guesses.indexOf(id) !== -1) return false;

  sess.guesses.unshift(id);
  if (id === sess.answerId) {
    sess.status = "won";
    const st = stats();
    // A daily streak survives only if the previous win was yesterday.
    const continues = S.kind === "unlimited" ||
      st.lastWinDay === previousDay(S.day) || st.lastWinDay === S.day;
    st.played++; st.won++;
    st.guessesInWins += sess.guesses.length;
    st.currentStreak = continues ? st.currentStreak + 1 : 1;
    st.maxStreak = Math.max(st.maxStreak, st.currentStreak);
    if (S.kind === "daily") st.lastWinDay = S.day;
  }
  save();
  return true;
}

function giveUp() {
  const sess = session();
  if (sess.status !== "playing") return;
  sess.status = "revealed";
  const st = stats();
  st.played++; st.currentStreak = 0;
  save();
}

function nextPuzzle() {
  const m = S.mode;
  S.seen[m] = [S.unlimited[m].answerId].concat(S.seen[m]).slice(0, 200);
  S.unlimited[m] = blankSession(unlimitedAnswer(m, S.seen[m]));
  S.kind = "unlimited";
  save();
}

function resetEverything() {
  S = freshState();
  save();
}

/* ============================================================
   Rendering
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

let countdownTimer = null;

function renderModes() {
  $("modes").innerHTML = MODE_ORDER.map(m => {
    const solved = S.daily[m].status === "won";
    const tick = (S.kind === "daily" && solved)
      ? '<span class="done" aria-label="solved today">✓</span>' : "";
    return '<button class="mode" data-mode="' + m + '" aria-current="' + (m === S.mode) + '">' +
             '<span class="disc">' + SVG[m] + tick + '</span>' +
             '<span class="mode-label">' + esc(MODES[m].label) + '</span>' +
           '</button>';
  }).join("");
}

function renderPanel() {
  const def = MODES[S.mode], st = stats();
  $("mode-heading").textContent = def.heading;
  $("mode-prompt").textContent = def.prompt;
  $("streak").className = "streak" + (st.currentStreak > 0 ? " lit" : "");
  $("streak").innerHTML = SVG.flame + st.currentStreak;

  $("kind-daily").innerHTML = SVG.calendar + "Daily";
  $("kind-unlimited").innerHTML = SVG.infinity + "Unlimited";
  $("kind-daily").setAttribute("aria-pressed", S.kind === "daily");
  $("kind-unlimited").setAttribute("aria-pressed", S.kind === "unlimited");

  $("btn-house").innerHTML = S.house ? esc(S.house.slice(0, 4).toUpperCase()) : SVG.shield;
  $("btn-spoiler").innerHTML = SVG.eyeOff;
  $("btn-spoiler").setAttribute("aria-pressed", S.spoilerFree);
  $("btn-stats").innerHTML = SVG.chart;
  $("btn-info").innerHTML = SVG.info;
}

function renderHints() {
  const def = MODES[S.mode], sess = session();
  const over = sess.status !== "playing";
  const n = sess.guesses.length;
  $("hints").innerHTML = def.hints.map(h => {
    const on = over || n >= h.after;
    const left = h.after - n;
    const inner = on
      ? '<span>' + esc(h.label) + '</span><span class="val">' + esc(h.reveal(sess.answerId)) + '</span>'
      : '<span>' + esc(h.label) + ' in ' + left + ' ' + (left === 1 ? "guess" : "guesses") + '</span>';
    return '<div class="hint' + (on ? " on" : "") + '">' +
             '<span class="glyph">' + esc(h.glyph) + '</span>' + inner +
           '</div>';
  }).join("");
}

function renderClue() {
  const def = MODES[S.mode], text = def.clue(session().answerId);
  if (!text) { $("clue").classList.add("hidden"); return; }
  $("clue").classList.remove("hidden");
  $("clue-kicker").textContent = def.clueKicker || "";
  $("clue-body").textContent = text;
}

function renderTable() {
  const def = MODES[S.mode], sess = session();
  const rows = sess.guesses.map(g => def.compare(g, sess.answerId)).filter(Boolean);
  if (!rows.length) { $("table").innerHTML = ""; return; }

  const head = def.columns.map(c => "<th>" + esc(c) + "</th>").join("");
  const body = rows.map(row => {
    const name = '<td><div class="cell name' + (row.correct ? " hit" : "") + '">' +
                 (row.image ? '<img class="thumb" src="' + esc(row.image) + '" alt="">' : "") +
                 "<span>" + esc(row.name) + "</span></div></td>";
    const rest = row.cells.map((c, i) => {
      const arrow = c.direction
        ? '<span class="arrow" aria-label="' + (c.direction === "up" ? "higher" : "lower") + '">' +
          (c.direction === "up" ? "▲" : "▼") + "</span>"
        : "";
      return '<td><div class="cell ' + c.state + '" style="animation-delay:' + (i * 70) + 'ms">' +
             "<span>" + esc(c.value) + "</span>" + arrow + "</div></td>";
    }).join("");
    return "<tr>" + name + rest + "</tr>";
  }).join("");

  $("table").innerHTML =
    '<div class="table-wrap"><table class="guesses"><thead><tr>' + head + "</tr></thead><tbody>" +
    body + "</tbody></table></div>" +
    '<p class="legend">' +
      '<span><i class="swatch" style="background:var(--hit)"></i> exact</span>' +
      '<span><i class="swatch" style="background:var(--close)"></i> partial / close</span>' +
      '<span><i class="swatch" style="background:var(--miss)"></i> wrong</span>' +
      "<span>▲ answer is higher · ▼ lower</span>" +
    "</p>";
}

function renderEnd() {
  const def = MODES[S.mode], sess = session();
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }

  if (sess.status === "playing") {
    $("end").innerHTML = "";
    $("giveup-wrap").classList.toggle("hidden", sess.guesses.length < 4);
    return;
  }
  $("giveup-wrap").classList.add("hidden");

  const name = def.displayName(sess.answerId);
  const art = def.portrait(sess.answerId);
  const initials = name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  const up = nextMode(S.mode);
  const n = sess.guesses.length;

  const tail = S.kind === "daily"
    ? '<p class="label">Next puzzle in:</p><p class="countdown" id="cd">' + formatCountdown(msUntilRollover()) + "</p>" +
      '<p class="label">(00:00 UTC)</p>' +
      '<div class="actions"><button class="btn" id="next">Keep playing — Unlimited</button></div>' +
      '<div class="next-mode"><p class="label">Next mode:</p>' +
        '<button class="mode" data-mode="' + up + '"><span class="disc">' + SVG[up] + "</span>" +
        '<span class="mode-label">' + esc(MODES[up].label) + "</span></button></div>"
    : '<div class="actions"><button class="btn" id="next">Next puzzle →</button>' +
      '<button class="btn ghost" data-mode="' + up + '">Try ' + esc(MODES[up].label) + "</button></div>";

  $("end").innerHTML =
    '<section class="end"><h2>' + (sess.status === "won" ? "You win!" : "Out of luck") + "</h2>" +
    '<div class="portrait">' + (art ? '<img src="' + esc(art) + '" alt="">' : "<span>" + esc(initials) + "</span>") + "</div>" +
    '<p class="label">' + (S.kind === "daily" ? "Today's answer was:" : "The answer was:") + "</p>" +
    '<p class="answer">' + esc(name) + "</p>" +
    (sess.status === "won" ? '<p class="label">Solved in ' + n + " " + (n === 1 ? "guess" : "guesses") + ".</p>" : "") +
    tail + "</section>";

  if (S.kind === "daily") {
    countdownTimer = setInterval(() => {
      const el = $("cd");
      if (!el) return;
      const left = msUntilRollover();
      el.textContent = formatCountdown(left);
      if (left <= 0 && syncDay()) render();
    }, 1000);
  }
}

function renderYesterday() {
  const el = $("yesterday");
  if (S.kind !== "daily" || S.spoilerFree) { el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  el.innerHTML = "Yesterday's answer was <b>" +
    esc(MODES[S.mode].displayName(dailyAnswer(S.mode, previousDay(S.day)))) + "</b>";
}

function renderInput() {
  const def = MODES[S.mode], over = session().status !== "playing";
  const input = $("guess");
  input.placeholder = def.placeholder;
  input.disabled = over;
  $("submit").disabled = over;
}

function render() {
  renderModes(); renderPanel(); renderHints(); renderClue();
  renderInput(); renderEnd(); renderTable(); renderYesterday();
}

/* ============================================================
   Autocomplete
   ============================================================ */
let matches = [], active = 0;

function closeSuggestions() {
  matches = []; active = 0;
  $("suggestions").classList.add("hidden");
  $("suggestions").innerHTML = "";
}

function updateSuggestions() {
  const q = $("guess").value.trim().toLowerCase();
  const sess = session();
  if (!q || sess.status !== "playing") return closeSuggestions();

  const used = new Set(sess.guesses);
  matches = MODES[S.mode].search
    .filter(item => !used.has(item.id))
    .map(item => {
      // Prefer a prefix match on any term, then any substring match.
      let best = Infinity, via = "";
      item.terms.forEach(term => {
        const i = term.indexOf(q);
        if (i === -1) return;
        const score = i === 0 ? 0 : 1;
        if (score < best) { best = score; via = term; }
      });
      return best === Infinity ? null : { item, score: best, via };
    })
    .filter(Boolean)
    .sort((a, b) => a.score - b.score || a.item.name.localeCompare(b.item.name))
    .slice(0, 8);

  if (!matches.length) return closeSuggestions();
  active = Math.min(active, matches.length - 1);
  $("suggestions").classList.remove("hidden");
  $("suggestions").innerHTML = matches.map((m, i) => {
    const alias = m.via !== m.item.name.toLowerCase()
      ? '<span class="alias"> — matched “' + esc(m.via) + "”</span>" : "";
    return '<li class="' + (i === active ? "active" : "") + '" role="option" aria-selected="' + (i === active) + '">' +
           '<button type="button" data-i="' + i + '">' + esc(m.item.name) + alias + "</button></li>";
  }).join("");
}

function commit(id) {
  if (!submitGuess(id)) {
    $("notice").textContent = "You have already guessed that one.";
    return;
  }
  $("notice").textContent = "";
  $("guess").value = "";
  closeSuggestions();
  render();
  if (!$("guess").disabled) $("guess").focus();
}

/* ============================================================
   Dialogs
   ============================================================ */
const HOUSES = ["Gryffindor","Hufflepuff","Ravenclaw","Slytherin"];

function openDialog(html) {
  $("dialog").innerHTML = '<div class="backdrop"><div class="modal">' +
    '<button class="modal-close" aria-label="Close">×</button>' + html + "</div></div>";
}
const closeDialog = () => { $("dialog").innerHTML = ""; };

function houseDialog() {
  openDialog("<h2>Choose your house</h2>" +
    "<p>Purely cosmetic — it just tags the header.</p>" +
    '<div class="houses">' + HOUSES.map(h =>
      '<button class="house-btn" data-house="' + h + '" aria-pressed="' + (S.house === h) + '">' + h + "</button>"
    ).join("") + "</div>" +
    '<p style="margin-top:14px"><button class="btn ghost" data-house="">No house, thanks</button></p>');
}

function statsDialog() {
  const bucket = S.stats[S.kind];
  const t = MODE_ORDER.reduce((a, m) => {
    const s = bucket[m];
    a.played += s.played; a.won += s.won; a.g += s.guessesInWins;
    a.best = Math.max(a.best, s.maxStreak);
    return a;
  }, { played:0, won:0, g:0, best:0 });
  const pct = t.played ? Math.round(t.won / t.played * 100) + "%" : "0%";

  openDialog("<h2>" + (S.kind === "daily" ? "Daily statistics" : "Unlimited statistics") + "</h2>" +
    '<div class="statgrid">' +
      '<div class="statbox"><b>' + t.played + "</b><span>played</span></div>" +
      '<div class="statbox"><b>' + pct + "</b><span>win rate</span></div>" +
      '<div class="statbox"><b>' + t.best + "</b><span>best streak</span></div>" +
      '<div class="statbox"><b>' + (t.won ? (t.g / t.won).toFixed(1) : "—") + "</b><span>avg guesses</span></div>" +
    "</div>" +
    '<table style="width:100%;border-collapse:collapse">' +
      '<thead><tr style="text-align:left;color:var(--text-dim);font-size:.85rem">' +
      "<th>Mode</th><th>Played</th><th>Won</th><th>Streak</th><th>Best</th></tr></thead><tbody>" +
      MODE_ORDER.map(m => {
        const s = bucket[m];
        return '<tr style="border-top:1px solid var(--edge)">' +
          '<td style="padding:8px 4px">' + esc(MODES[m].label) + "</td>" +
          '<td style="padding:8px 4px">' + s.played + "</td>" +
          '<td style="padding:8px 4px">' + s.won + "</td>" +
          '<td style="padding:8px 4px">' + s.currentStreak + "</td>" +
          '<td style="padding:8px 4px">' + s.maxStreak + "</td></tr>";
      }).join("") +
    "</tbody></table>" +
    '<p style="margin-top:18px"><button class="btn ghost" id="reset">Reset all progress</button></p>');
}

function infoDialog() {
  openDialog("<h2>How to play</h2><ul>" +
    "<li><b>Classic</b> — guess the character. Each guess fills a row comparing house, blood status, species, patronus and more against the answer.</li>" +
    "<li><b>Quote</b> — a line is shown; work out who would say it.</li>" +
    "<li><b>Spell</b> — a spell's effect is described; name the spell.</li>" +
    "<li><b>Description</b> — a character is described without being named.</li>" +
    "<li><b>Location</b> — a place is described; name it.</li></ul>" +
    "<p>Green means an exact match, amber means close or partially overlapping, red means wrong. Arrows on numeric columns point towards the answer.</p>" +
    "<p><b>Daily</b> gives everyone the same five puzzles, rolling over at 00:00 UTC, and keeps a streak. <b>Unlimited</b> deals a fresh puzzle whenever you want one, with its own separate stats — so practising never costs you a daily streak.</p>" +
    '<p style="font-size:.85rem;opacity:.8">An unofficial fan game. All clue text here is original writing, including the lines in Quote mode, which are invented rather than quoted. Character and spell attributes are drawn from the published books. Not affiliated with or endorsed by the rights holders.</p>');
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener("click", e => {
  const modeBtn = e.target.closest("[data-mode]");
  if (modeBtn) {
    S.mode = modeBtn.getAttribute("data-mode");
    save(); closeDialog(); render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const sugg = e.target.closest(".suggestions button");
  if (sugg) { commit(matches[+sugg.getAttribute("data-i")].item.id); return; }

  const houseBtn = e.target.closest("[data-house]");
  if (houseBtn) {
    S.house = houseBtn.getAttribute("data-house") || null;
    save(); closeDialog(); render();
    return;
  }
  if (e.target.closest(".modal-close") || e.target.classList.contains("backdrop")) { closeDialog(); return; }
  if (e.target.closest("#reset")) { resetEverything(); closeDialog(); render(); return; }
  if (e.target.closest("#next")) {
    nextPuzzle(); render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if (e.target.closest("#giveup")) { giveUp(); render(); return; }
  if (e.target.closest("#btn-house")) { houseDialog(); return; }
  if (e.target.closest("#btn-stats")) { statsDialog(); return; }
  if (e.target.closest("#btn-info"))  { infoDialog(); return; }
  if (e.target.closest("#btn-spoiler")) { S.spoilerFree = !S.spoilerFree; save(); render(); return; }
  if (e.target.closest("#kind-daily"))     { S.kind = "daily";     $("notice").textContent = ""; save(); render(); return; }
  if (e.target.closest("#kind-unlimited")) { S.kind = "unlimited"; $("notice").textContent = ""; save(); render(); return; }
  if (e.target.closest("#submit")) { if (matches.length) commit(matches[active].item.id); return; }
  if (!e.target.closest(".guessbar")) closeSuggestions();
});

$("guess").addEventListener("input", () => { active = 0; updateSuggestions(); });
$("guess").addEventListener("focus", updateSuggestions);
$("guess").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(active + 1, matches.length - 1); updateSuggestions(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(active - 1, 0); updateSuggestions(); }
  else if (e.key === "Enter") { e.preventDefault(); if (matches.length) commit(matches[active].item.id); }
  else if (e.key === "Escape") closeSuggestions();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDialog(); });

/* ============================================================
   Boot
   ============================================================ */
S = load();
syncDay();
render();
// Catch a rollover that happens while the tab is left open.
setInterval(() => { if (syncDay()) render(); }, 30000);
</script>
</body>
</html>
